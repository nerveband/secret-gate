services:
  secret-gate:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      OP_CONNECT_HOST: "${OP_CONNECT_HOST}"
      OP_CONNECT_TOKEN: "${OP_CONNECT_TOKEN}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      WEBHOOK_BASE_URL: "${WEBHOOK_BASE_URL}"
      REQUEST_TTL: "${REQUEST_TTL:-15m}"
      CLEANUP_INTERVAL: "${CLEANUP_INTERVAL:-5m}"
      AUTO_APPROVE_TTL: "${AUTO_APPROVE_TTL:-30m}"
      TELEGRAM_APPROVER_USER_ID: "${TELEGRAM_APPROVER_USER_ID:-}"
      TELEGRAM_NOTIFICATIONS: "${TELEGRAM_NOTIFICATIONS:-on}"
      TIMEZONE: "${TIMEZONE:-America/Los_Angeles}"
      OWNER_WINDOW_VAULTS: "${OWNER_WINDOW_VAULTS:-}"
      OWNER_WINDOW_ENABLED: "${OWNER_WINDOW_ENABLED:-false}"
    volumes:
      - secret-gate-state:/app/state
    restart: unless-stopped

volumes:
  secret-gate-state:
