name: Test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./... -count=1 -v
      - run: go vet ./...

  # macOS bills 10x on this private repo, so the native client run is limited
  # to release tags and manual dispatch. Every push and PR still runs Linux.
  macos-client-test:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run portable client tests natively on macOS
        run: go test -race -count=1 ./internal/clientconfig ./internal/daemon ./internal/mcpserver ./cmd/client
