name: Secret Gate

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why approval is needed
        required: false
        default: Manual gate check

jobs:
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send Telegram gate message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          GATE_REASON: ${{ inputs.reason }}
        run: node scripts/send-telegram-gate.mjs

  gate:
    name: Await GitHub approval
    needs: notify
    runs-on: ubuntu-latest
    environment: secret-gate
    steps:
      - name: Approval received
        run: echo "Secret Gate approved."
